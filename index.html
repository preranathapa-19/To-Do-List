<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <section
      class="min-h-screen bg-gradient-to-r from-[#153677] to-[#4E085F] flex items-center justify-center"
    >
      <div class="bg-white h-[200px] w-[380px] rounded">
        <h2 class="text-xl font-bold text-blue-800 pl-8 pt-4">To-Do-List <img src="images/images/icon.png" class="w-6 h-6 inline-block" /> </h2>
       <div>
         <input
          type="text"
          placeholder="Add your task"
          class="px-10 py-2 bg-gray-200 rounded m-3"
        />
        <button
          class="text-white bg-orange-600 rounded-xl px-5 py-2 font-semibold"
        >
          Add
        </button>
       </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
